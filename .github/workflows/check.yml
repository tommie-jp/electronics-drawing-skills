name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # markdownlint、SKILL.md の front matter (厳密な YAML)、marketplace.json と plugin.json の突き合わせ
      - run: npm run all
